# Central configuration of the pipeline: data versions, stages and their order.
# The parameters of the analysis and of the stages are in settings.toml.
#
# Every stage lives inside a data version:
#     {data.root}/{version}/{path}
# where path = stages.<key>.path (default: the key itself), unless the version overrides it in versions.<v>.paths.
# Raw data is the single source of truth and sits outside the versions:
#     {data.root}/{data.raw.path}
# Plots are versioned like the data they show:
#     {plots.root}/{version}/{path}
# The order of the stages follows from their inputs (`python main.py list`). A frozen version is read-only.
#
# Versions are strings ("1.0", not 1.0): as TOML floats, 1.1 and 1.10 would be equal.
#
# Machine-specific paths (data.root, plots.root) are not stored here: they are set in config.local.toml
# (not versioned, see config.local.example.toml), which is merged over this file.

[data]
# active version: the one the stages read from and write to
version = "2.0"

[data.raw]
path = "raw"
description = "Raw CSV files from the measuring equipment (OCH_*, PAC_*), one directory per condition. Read-only."

[data.spoiled]
path = "spoiled"
description = "Copies of the inputs rejected by a stage, one directory per condition, with the reasons in _failures.csv."

# ================================ VERSIONS =================================

[versions."1.0"]
description = "Pre-refactor results."
frozen = true

# directory names of the stages before the refactoring
[versions."1.0".paths]
recordings = "extracted"
cleaned = "preprocessed"
filtered = "filtered"
beats = "metrics"
paired = "dtw/raw"
# normalised and aligned: version 1.0 kept only the aligned files (the removed subjects are in spoiled/{B}/aligning_data)
normalised = "dtw/preprocessed"
aligned = "dtw/preprocessed"
costs = "dtw/dtw"
pairs = "dtw/reorganised"
mean_costs = "dtw/summary"
anova = "statistics"
tables = "characteristics"
features = "classification/features"
cv_results = "classification/results"
scores = "classification/summary"

[versions."2.0"]
description = "Refactored pipeline; revised results."
frozen = false

# ================================= STAGES ==================================
# input: stage(s) the data is computed from ("raw" = raw data)
# class: class of the stage (ddtw_ml.pipeline.Stage), with run(); its parameters are in settings.toml

[stages.recordings]
description = "DateTime (Excel serial), ABP, CBFV = max(FV left, FV right), BPM per subject: {condition}/V{i}_{condition}.csv"
input = ["raw"]
class = "ddtw_ml.stages.recordings.ImportRecordings"

[stages.cleaned]
description = "Signals after artefact and outlier removal, trimming, interpolation and smoothing: {condition}/..._PP.csv"
input = ["recordings"]
class = "ddtw_ml.stages.cleaned.CleanSignals"

[stages.filtered]
description = "ABP and CBFV with the breathing frequency removed (FFT): {condition}/..._PP_F.csv"
input = ["cleaned"]
class = "ddtw_ml.stages.filtered.RemoveBreathing"

[stages.beats]
description = "Beat-to-beat metrics (SPO, SPP, DN, DPP, RR): {condition}/..._PP_F/{ABP,CBFV}.csv"
input = ["filtered"]
class = "ddtw_ml.stages.beats.ComputeBeatMetrics"

[stages.paired]
description = "ABP and CBFV beats paired by their number in one file: {condition}/..._PP_F_M.csv"
input = ["beats"]
class = "ddtw_ml.stages.paired.PairBeatMetrics"

[stages.normalised]
description = "Metrics after outlier removal, interpolation and Generalized Logistic normalisation: {condition}/..._M_PP.csv"
input = ["paired"]
class = "ddtw_ml.stages.normalised.NormaliseBeatMetrics"

[stages.aligned]
description = "Normalised metrics of the subjects present in all conditions (the others to spoiled/{condition}/aligning_data): {condition}/..._M_PP.csv"
input = ["normalised"]
class = "ddtw_ml.stages.aligned.AlignSubjects"

[stages.costs]
description = "Sliding-window DDTW costs of the ABP-CBFV metric pairs: {method}/{condition}/..._PP_DTW.csv"
input = ["aligned"]
class = "ddtw_ml.stages.costs.ComputeDtwCosts"

[stages.pairs]
description = "DTW costs per metric pair, one column per subject: {method}/{condition}/{pair}.csv"
input = ["costs"]
class = "ddtw_ml.stages.pairs.GroupCostsByPair"

[stages.mean_costs]
description = "Mean DTW cost per subject and method_condition: {pair}.csv"
input = ["pairs"]
class = "ddtw_ml.stages.mean_costs.AverageCostsPerSubject"

[stages.anova]
description = "RM-ANOVA and Bonferroni post-hoc of the mean DTW costs between the conditions: {pair}/{method}_{anova,posthoc}_results.csv"
input = ["mean_costs"]
class = "ddtw_ml.stages.anova.CompareConditions"

[stages.tables]
description = "Medians and IQRs of the beat-to-beat metrics for the LaTeX tables and the RM-ANOVA of the metrics"
input = ["paired"]
class = "ddtw_ml.stages.tables.TabulateMedians"

[stages.metric_anova]
description = "RM-ANOVA and Bonferroni post-hoc of the medians of the metrics between the conditions: {metric}.csv"
input = ["tables"]
class = "ddtw_ml.stages.metric_anova.CompareMetricMedians"

[stages.features]
description = "Feature matrices built from the sliding-window DTW costs: {method}/{pair}.csv"
input = ["pairs"]
class = "ddtw_ml.stages.features.BuildFeatureMatrices"

[stages.cv_results]
description = "Per-model cross-validation results: {method}/{pair}/{model}/{validation}/"
input = ["features"]
class = "ddtw_ml.stages.cv_results.CrossValidateClassifiers"

[stages.scores]
description = "Classification metrics collected per model: {model}.csv"
input = ["cv_results"]
class = "ddtw_ml.stages.scores.CollectClassifierScores"

# ================================== PLOTS ==================================
# path: relative to {plots.root}/{version} (default: the key itself)

[plots.cleaning]
description = "Signals before and after each cleaning step: {file}.pdf"
input = ["recordings"]
class = "ddtw_ml.plots.cleaning.PlotCleaningSteps"

[plots.beats]
description = "Beat-to-beat metrics before and after normalisation: {paired,normalised}/{metric}/{condition}/{file}.pdf"
input = ["paired", "normalised"]
class = "ddtw_ml.plots.beats.PlotBeatMetrics"

[plots.costs]
description = "DTW cost per sliding window: {method}/{condition}/{file}.pdf"
input = ["costs"]
class = "ddtw_ml.plots.costs.PlotCostsPerWindow"
