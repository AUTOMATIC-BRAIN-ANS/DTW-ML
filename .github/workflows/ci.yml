# Lint (ruff), type check (mypy) and unit tests (pytest) on every push to master and on pull requests.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the code imports `project.*`, so keep the checkout directory named like the package
          path: project
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: project/pyproject.toml
      - run: pip install -e "./project[dev]"
      - name: Ruff (import order, unused imports)
        working-directory: project
        run: ruff check --output-format=github .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: project/pyproject.toml
      - run: pip install -e "./project[dev]"
      - name: Mypy
        working-directory: project
        run: mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: project/pyproject.toml
      - run: pip install -e "./project[dev]"
      - name: Pytest
        working-directory: project
        run: python -m pytest -q
